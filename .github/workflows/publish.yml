name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.6)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Resolve tag
        id: tag
        run: |
          RAW="${{ inputs.tag || github.event.release.tag_name }}"
          if [[ -z "$RAW" ]]; then
            echo "No tag provided" >&2
            exit 1
          fi
          if [[ "$RAW" == v* ]]; then
            echo "ref=$RAW" >> "$GITHUB_OUTPUT"
          else
            echo "ref=v$RAW" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          # Do not set registry-url. setup-node@v4 then writes an .npmrc
          # with _authToken and exports a dummy NODE_AUTH_TOKEN, which
          # makes npm skip OIDC trusted publishing.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: |
          unset NODE_AUTH_TOKEN NPM_CONFIG_USERCONFIG
          npm publish --access public

      - name: Create publish summary
        run: |
          echo "## 📦 Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** @qastudio-dev/playwright" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.tag.outputs.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ github.event.release.html_url }}" >> $GITHUB_STEP_SUMMARY
